<!-- One day. The page is twenty-four hours of light and scrolling is time; you arrive at the hour it is where you are, after the day runs forward to meet you. Everything sits in the order of the day, and each thing gets its moment: it holds the centre of the screen and grows while you keep scrolling, then lets go. The aurora moves like an aurora in the small hours. Greece passes sideways at noon while the page holds still. The West is seen through windows that pan. Poems write themselves in where their mood lives. The records play late. The sky, the sun, the moon, the stars, the meteors, the ink and the exposure of the pictures follow the hour under your eyes. -->
