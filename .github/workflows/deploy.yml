name: Deploy

# Push to main and the site goes to Cloudflare: the files, plus the small Worker behind /sky.
# CI, scan settings and the README are not part of the site, so changing only those deploys nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.zap/**'
      - '.gitleaks.toml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and check the site
        run: ./.github/scripts/assemble.sh

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy
