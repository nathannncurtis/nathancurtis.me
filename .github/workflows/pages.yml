name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude=.git --exclude=.github --exclude=.gitignore --exclude=README.md --exclude=_site ./ _site/

      - name: Check the site
        run: |
          for f in index.html 404.html CNAME LICENSE robots.txt sitemap.xml llms.txt humans.txt \
                   .well-known/security.txt privacy/index.html work/index.html work/ascii3d.js \
                   work/pretext/layout.js content.js sig-strokes.js fonts/fonts.css fonts/work-fonts.css; do
            test -s "_site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -qx 'nathancurtis.me' _site/CNAME || { echo "::error::CNAME is not nathancurtis.me"; exit 1; }
          test ! -e _site/README.md

      # include-hidden-files keeps .well-known; .git and .github are always left out
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
