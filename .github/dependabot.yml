# Version bumps once a month, one grouped PR. Security fixes still come as they appear.
# The site itself has no packages; the actions and the test tools in .github/tests are what is tracked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /.github/tests
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
