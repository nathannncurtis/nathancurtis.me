name: serve
description: Node and the test tools, the site assembled, site.localhost pointing here, and (unless start is false) wrangler dev on :8787.
inputs:
  start:
    description: Start wrangler dev and wait for it.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: .github/tests/package-lock.json
    - name: Test tools
      shell: bash
      working-directory: .github/tests
      run: npm ci --no-audit --no-fund
    - name: Assemble the site
      shell: bash
      run: ./.github/scripts/assemble.sh
    # A name that isn't localhost, so the day page calls this Worker's /sky instead of borrowing the live one.
    - name: site.localhost is this machine
      if: runner.os != 'Windows'
      shell: bash
      run: echo '127.0.0.1 site.localhost' | sudo tee -a /etc/hosts
    - name: site.localhost is this machine
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value '127.0.0.1 site.localhost'
    - name: wrangler dev
      if: inputs.start == 'true'
      shell: bash
      run: |
        nohup node .github/tests/node_modules/wrangler/bin/wrangler.js dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
        for i in $(seq 90); do curl -sf -o /dev/null http://site.localhost:8787/ && exit 0; sleep 1; done
        cat "$RUNNER_TEMP/wrangler.log"; exit 1
